<script>
const KAMPUS = { alamatResmi: '' }; // isi dengan alamat Nusacoin resmi Universitas Nusa
const API_BASE = 'https://explorer.nusacoin.org';
const CERT_PREFIX = 'NUXCERT1:';
    const NODE_API = 'https://api.nusacoin.org';
    const DUST_SATS = 546;
    const VS_PREFIX = 'VSIGN1:';
    let liveWalletData = { pkey: null, address: null, balance: 0 };
    let pendingUtxos = [];
    const pendingSpent = new Set();
  const NUSACOIN_PARAMS = {
    bech32: 'nu',
    pubKeyHash: 0x35, // Awalan 'N'
    scriptHash: 0x4b, // Awalan 'X'
    wif: 0x57         // Prefix WIF Nusacoin
  };

  const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
  const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

  function polymod(values) {
    let chk = 1;
    for (let p = 0; p < values.length; ++p) {
      let top = chk >> 25;
      chk = ((chk & 0x1ffffff) << 5) ^ values[p];
      if ((top >> 0) & 1) chk ^= 0x3b6a57b2;
      if ((top >> 1) & 1) chk ^= 0x26508e6d;
      if ((top >> 2) & 1) chk ^= 0x1ea119fa;
      if ((top >> 3) & 1) chk ^= 0x3d4233dd;
      if ((top >> 4) & 1) chk ^= 0x2a1462b3;
    }
    return chk;
  }

  function hrpExpand(hrp) {
    let ret = [];
    for (let i = 0; i < hrp.length; ++i) ret.push(hrp.charCodeAt(i) >> 5);
    ret.push(0);
    for (let i = 0; i < hrp.length; ++i) ret.push(hrp.charCodeAt(i) & 31);
    return ret;
  }

  function convertBits(data, frombits, tobits, pad = true) {
    let acc = 0, bits = 0, ret = [], maxv = (1 << tobits) - 1;
    for (let i = 0; i < data.length; ++i) {
      let value = data[i];
      if (value < 0 || value >> frombits !== 0) return null;
      acc = (acc << frombits) | value;
      bits += frombits;
      while (bits >= tobits) {
        bits -= tobits;
        ret.push((acc >> bits) & maxv);
      }
    }
    if (pad) {
      if (bits > 0) ret.push((acc << (tobits - bits)) & maxv);
    } else if (bits >= frombits || ((acc << (tobits - bits)) & maxv)) {
      return null;
    }
    return ret;
  }

  function toBech32(hrp, version, program) {
    let data = [version].concat(convertBits(program, 8, 5, true));
    let checksumData = hrpExpand(hrp).concat(data).concat([0, 0, 0, 0, 0, 0]);
    let mod = polymod(checksumData) ^ 1;
    let ret = hrp + '1';
    for (let p = 0; p < data.length; ++p) ret += BECH32_CHARSET.charAt(data[p]);
    for (let p = 0; p < 6; ++p) ret += BECH32_CHARSET.charAt((mod >> (5 * (5 - p))) & 31);
    return ret;
  }

  function toBase58(buffer) {
    let digits = [0];
    for (let i = 0; i < buffer.length; i++) {
      for (let j = 0; j < digits.length; j++) digits[j] <<= 8;
      digits[0] += buffer[i];
      let carry = 0;
      for (let j = 0; j < digits.length; ++j) {
        digits[j] += carry;
        carry = (digits[j] / 58) | 0;
        digits[j] %= 58;
      }
      while (carry) {
        digits.push(carry % 58);
        carry = (carry / 58) | 0;
      }
    }
    for (let i = 0; buffer[i] === 0 && i < buffer.length - 1; i++) digits.push(0);
    return digits.reverse().map(d => ALPHABET[d]).join('');
  }

  function fromBase58(string) {
    let bytes = [0];
    for (let i = 0; i < string.length; i++) {
      let c = string[i];
      let value = ALPHABET.indexOf(c);
      if (value === -1) throw new Error("Karakter Base58 tidak valid");
      for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
      bytes[0] += value;
      let carry = 0;
      for (let j = 0; j < bytes.length; ++j) {
        bytes[j] += carry;
        carry = bytes[j] >> 8;
        bytes[j] &= 0xff;
      }
      while (carry) {
        bytes.push(carry & 0xff);
        carry >>= 8;
      }
    }
    for (let i = 0; string[i] === '1' && i < string.length - 1; i++) bytes.push(0);
    return new Uint8Array(bytes.reverse());
  }

  function toBase58Check(payload) {
    const sha1 = CryptoJS.SHA256(CryptoJS.lib.WordArray.create(payload));
    const sha2 = CryptoJS.SHA256(sha1);
    
    const checksum = sha2.words.slice(0, 1);
    const checksumBytes = [
      (checksum[0] >>> 24) & 0xff,
      (checksum[0] >>> 16) & 0xff,
      (checksum[0] >>> 8) & 0xff,
      checksum[0] & 0xff
    ];

    const fullPayload = new Uint8Array(payload.length + 4);
    fullPayload.set(payload);
    fullPayload.set(checksumBytes, payload.length);

    return toBase58(fullPayload);
  }

  function getAddressFromWif(wif, addrType = "bech32") {
    try {
      const decoded = fromBase58(wif);
      const rawPrivKey = decoded.slice(1, 33);
      
      const ec = new elliptic.ec('secp256k1');
      const keyPair = ec.keyFromPrivate(rawPrivKey);
      const pubKeyHex = keyPair.getPublic(true, 'hex');
      const pubKeyWordArray = CryptoJS.enc.Hex.parse(pubKeyHex);

      const shaHash = CryptoJS.SHA256(pubKeyWordArray);
      const ripemdHash = CryptoJS.RIPEMD160(shaHash);

      const pubKeyHash = new Uint8Array(20);
      for (let i = 0; i < 20; i++) {
        pubKeyHash[i] = (ripemdHash.words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
      }

      if (addrType === "p2pkh") {
        const p2pkhPayload = new Uint8Array(21);
        p2pkhPayload[0] = NUSACOIN_PARAMS.pubKeyHash;
        p2pkhPayload.set(pubKeyHash, 1);
        return toBase58Check(p2pkhPayload);
      } else if (addrType === "p2sh") {
        const p2shPayload = new Uint8Array(21);
        p2shPayload[0] = NUSACOIN_PARAMS.scriptHash;
        p2shPayload.set(pubKeyHash, 1);
        return toBase58Check(p2shPayload);
      } else {
        return toBech32(NUSACOIN_PARAMS.bech32, 0, pubKeyHash);
      }
    } catch(err) {
      console.error("Gagal mendapatkan alamat dari WIF:", err);
      return wif;
    }
  }
  function isValidWif(wif) {
    try {
      const d = fromBase58(wif);
      if (d.length !== 37 && d.length !== 38) return false;
      if (d[0] !== NUSACOIN_PARAMS.wif) return false;
      const body = d.slice(0, d.length - 4);
      const chk = d.slice(d.length - 4);
      const h = CryptoJS.SHA256(CryptoJS.SHA256(CryptoJS.lib.WordArray.create(body)));
      for (let i = 0; i < 4; i++) {
        if (((h.words[0] >>> (24 - i * 8)) & 0xff) !== chk[i]) return false;
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  function isAddressText(t) {
    return t.startsWith("N") || t.startsWith("X") || t.startsWith("nu1");
  }

  // Teks hasil enkripsi CryptoJS (AES passphrase) selalu diawali "U2FsdGVkX1" (= "Salted__")
  function isEncryptedText(t) {
    return t.startsWith("ENC:") || t.startsWith("U2FsdGVkX1");
  }
  function numToLEHex(val, bytes) {
    let hex = Number(val).toString(16);
    if (hex.length % 2 !== 0) hex = '0' + hex;
    while (hex.length < bytes * 2) hex = '0' + hex;
    return hex.match(/../g).reverse().join('');
  }

  function numTo64BitLEHex(val) {
    let hex = BigInt(val).toString(16);
    while (hex.length < 16) hex = '0' + hex;
    return hex.match(/../g).reverse().join('');
  }

  function varIntHex(n) {
    if (n < 0xfd) return numToLEHex(n, 1);
    if (n <= 0xffff) return 'fd' + numToLEHex(n, 2);
    return 'fe' + numToLEHex(n, 4);
  }

  function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function reverseHex(hex) { return hex.match(/../g).reverse().join(''); }

  function sha256dHex(hex) {
    return CryptoJS.SHA256(CryptoJS.SHA256(CryptoJS.enc.Hex.parse(hex))).toString();
  }

  function hash160Hex(hex) {
    return CryptoJS.RIPEMD160(CryptoJS.SHA256(CryptoJS.enc.Hex.parse(hex))).toString();
  }

  // Alamat Nusacoin -> scriptPubKey (hex). Mendukung P2PKH (N...), P2SH (X...), Bech32 (nu1q...)
  function addressToScriptHex(address) {
    const addr = (address || '').trim();
    if (!addr) throw new Error("Alamat kosong.");
    const lower = addr.toLowerCase();

    if (lower.startsWith(NUSACOIN_PARAMS.bech32 + '1')) {
      if (addr !== lower && addr !== addr.toUpperCase()) throw new Error("Alamat bech32 tidak valid (huruf campuran).");
      const pos = lower.lastIndexOf('1');
      const hrp = lower.slice(0, pos);
      if (hrp !== NUSACOIN_PARAMS.bech32) throw new Error("Prefix alamat bech32 bukan Nusacoin.");
      const data = [];
      for (const c of lower.slice(pos + 1)) {
        const v = BECH32_CHARSET.indexOf(c);
        if (v < 0) throw new Error("Karakter alamat bech32 tidak valid.");
        data.push(v);
      }
      if (data.length < 7) throw new Error("Alamat bech32 terlalu pendek.");
      if (polymod(hrpExpand(hrp).concat(data)) !== 1) throw new Error("Checksum alamat bech32 salah. Periksa kembali alamat tujuan.");
      if (data[0] !== 0) throw new Error("Hanya SegWit v0 (nu1q...) yang didukung.");
      const prog = convertBits(data.slice(1, -6), 5, 8, false);
      if (!prog) throw new Error("Program alamat bech32 tidak valid.");
      if (prog.length === 20) return '0014' + bytesToHex(prog);
      if (prog.length === 32) return '0020' + bytesToHex(prog);
      throw new Error("Panjang program alamat bech32 tidak valid.");
    }

    let raw;
    try { raw = fromBase58(addr); } catch (e) { throw new Error("Alamat tidak valid (bukan Base58/Bech32)."); }
    if (raw.length !== 25) throw new Error("Panjang alamat tidak valid.");
    const payload = raw.slice(0, 21);
    if (sha256dHex(bytesToHex(payload)).slice(0, 8) !== bytesToHex(raw.slice(21))) {
      throw new Error("Checksum alamat salah. Periksa kembali alamat tujuan.");
    }
    const h = bytesToHex(raw.slice(1, 21));
    if (payload[0] === NUSACOIN_PARAMS.pubKeyHash) return '76a914' + h + '88ac';
    if (payload[0] === NUSACOIN_PARAMS.scriptHash) return 'a914' + h + '87';
    throw new Error("Prefix alamat bukan alamat Nusacoin.");
  }

  // Susun + tanda tangani transaksi. Mendukung input P2PKH (legacy) & P2WPKH (SegWit, BIP143)
  function buildSignedTransaction(utxos, outputs, privateKeyWif, ownScript) {
    const decoded = fromBase58(privateKeyWif);
    const ec = new elliptic.ec('secp256k1');
    const keyPair = ec.keyFromPrivate(decoded.slice(1, 33));
    const pubHex = keyPair.getPublic(true, 'hex');
    const pkh = hash160Hex(pubHex);

    const isSegwit = ownScript === '0014' + pkh;
    const isLegacy = ownScript === '76a914' + pkh + '88ac';
    if (!isSegwit && !isLegacy) {
      throw new Error("Private key tidak cocok dengan alamat wallet, atau tipe alamat (P2SH) tidak bisa dibelanjakan dari kartu ini. Pilih format Bech32 atau P2PKH saat membuka wallet.");
    }

    const VERSION = '01000000', LOCKTIME = '00000000', SEQ = 'ffffffff', SIGHASH_ALL = '01000000';
    const outsHex = outputs.map(o => numTo64BitLEHex(o.value) + varIntHex(o.script.length / 2) + o.script).join('');
    const outsSer = varIntHex(outputs.length) + outsHex;
    const ins = utxos.map(u => ({ prev: reverseHex(u.txid) + numToLEHex(u.vout, 4), value: u.value }));
    const signDigest = (digestHex) => keyPair.sign(digestHex, { canonical: true }).toDER('hex') + '01';

    let inputsSer = varIntHex(ins.length);
    let witness = '';

    if (isLegacy) {
      ins.forEach((inp, i) => {
        let pre = VERSION + varIntHex(ins.length);
        ins.forEach((o, j) => {
          pre += o.prev + (i === j ? varIntHex(ownScript.length / 2) + ownScript : '00') + SEQ;
        });
        pre += outsSer + LOCKTIME + SIGHASH_ALL;
        const sig = signDigest(sha256dHex(pre));
        const scriptSig = varIntHex(sig.length / 2) + sig + varIntHex(pubHex.length / 2) + pubHex;
        inputsSer += inp.prev + varIntHex(scriptSig.length / 2) + scriptSig + SEQ;
      });
    } else {
      const hashPrevouts = sha256dHex(ins.map(x => x.prev).join(''));
      const hashSequence = sha256dHex(ins.map(() => SEQ).join(''));
      const hashOutputs = sha256dHex(outsHex);
      const scriptCode = '1976a914' + pkh + '88ac';
      ins.forEach(inp => {
        const pre = VERSION + hashPrevouts + hashSequence + inp.prev + scriptCode +
                    numTo64BitLEHex(inp.value) + SEQ + hashOutputs + LOCKTIME + SIGHASH_ALL;
        const sig = signDigest(sha256dHex(pre));
        witness += '02' + varIntHex(sig.length / 2) + sig + varIntHex(pubHex.length / 2) + pubHex;
        inputsSer += inp.prev + '00' + SEQ;
      });
    }

    const legacySer = VERSION + inputsSer + outsSer + LOCKTIME;
    const raw = isSegwit ? VERSION + '0001' + inputsSer + outsSer + witness + LOCKTIME : legacySer;
    const txid = reverseHex(sha256dHex(legacySer));
    return { raw, txid };
  }
  function normalizeUtxos(data, ownAddr) {
    let arr = data;
    if (data && !Array.isArray(data)) {
      arr = data.result ?? data.utxos ?? data.unspent ?? data.unspents ?? data.data ?? data.unspent_outputs ?? null;
      if (arr && !Array.isArray(arr)) arr = arr.utxos ?? arr.unspents ?? arr.unspent ?? null;
    }
    if (!Array.isArray(arr)) return null;
    return arr.map(u => {
      if (ownAddr && typeof u.address === 'string' && u.address !== ownAddr) return { txid: null };
      const txid = u.txid || u.tx_hash || u.hash || u.txHash;
      const vout = [u.vout, u.n, u.tx_output_n, u.tx_pos, u.index, u.outputIndex].find(v => v !== undefined);
      let value;
      if (u.satoshis !== undefined) value = Number(u.satoshis);
      else if (u.amount !== undefined) value = Math.round(Number(u.amount) * 1e8);
      else if (u.value !== undefined) value = Number.isInteger(Number(u.value)) ? Number(u.value) : Math.round(Number(u.value) * 1e8);
      let confirmed = true;
      if (u.confirmations !== undefined) confirmed = Number(u.confirmations) > 0;
      else if (u.confirmed !== undefined) confirmed = !!u.confirmed;
      else if (u.status && u.status.confirmed !== undefined) confirmed = !!u.status.confirmed;
      return { txid, vout: Number(vout), value, confirmed };
    }).filter(u => typeof u.txid === 'string' && /^[0-9a-fA-F]{64}$/.test(u.txid) &&
                   Number.isInteger(u.vout) && Number.isFinite(u.value) && u.value > 0);
  }

  // Total UTXO terkonfirmasi harus sama dengan saldo yang dibaca explorer, supaya tidak salah pakai data
  function utxoMatchesBalance(list) {
    const bal = liveWalletData.balance;
    if (!(bal >= 0)) return true;
    const total = list.filter(u => u.confirmed !== false).reduce((s, u) => s + u.value, 0) / 1e8;
    return Math.abs(total - bal) <= Math.max(0.00001, bal * 0.001);
  }

  // Hitung UTXO dari explorer (Iquidus): ambil transaksi alamat, lalu keluaran milik alamat yang belum dibelanjakan
  async function fetchUtxosFromExplorer(addr) {
    let base = API_BASE;
    if (base.endsWith('/')) base = base.slice(0, -1);
    if (base.endsWith('/api')) base = base.replace(/\/api$/, '');

    const listRes = await fetch(`${base}/ext/getaddresstxs/${addr}/0/200`);
    if (!listRes.ok) throw new Error("explorer: daftar transaksi gagal (HTTP " + listRes.status + ")");
    const raw = await listRes.json();
    const arr = Array.isArray(raw) ? raw : (raw.data || raw.records || []);
    const txids = [...new Set(arr.map(i => i.txid || (typeof i === 'string' ? i : null)).filter(Boolean))];
    if (!txids.length) return [];

    const decoded = await Promise.all(txids.map(async txid => {
      const r = await fetch(`${base}/api/getrawtransaction?txid=${txid}&decrypt=1`);
      if (!r.ok) throw new Error("explorer: getrawtransaction gagal (HTTP " + r.status + ")");
      const t = await r.text();
      let j; try { j = JSON.parse(t); } catch (e) { throw new Error("explorer: respons getrawtransaction bukan JSON"); }
      if (!j || !Array.isArray(j.vout)) throw new Error("explorer: detail transaksi tidak lengkap");
      return j;
    }));

    const spent = new Set();
    decoded.forEach(t => (t.vin || []).forEach(v => { if (v.txid !== undefined) spent.add(v.txid + ':' + v.vout); }));

    const out = [];
    decoded.forEach(t => (t.vout || []).forEach(o => {
      const spk = o.scriptPubKey || {};
      const addrs = spk.addresses || (spk.address ? [spk.address] : []);
      if (addrs.includes(addr) && !spent.has(t.txid + ':' + o.n)) {
        out.push({ txid: t.txid, vout: o.n, value: Math.round(Number(o.value) * 1e8), confirmed: true });
      }
    }));
    return out.filter(u => u.value > 0);
  }
  const CONFLICT_RE = /conflict|missing-?inputs|missingorspent|already spent|double.?spend|txn-mempool/i;

  // --- Broadcast via POST /broadcast (parameter: raw) ---
  async function broadcastRawTx(apiBase, rawHex, expectedTxid) {
    const url = `${apiBase}/broadcast`;
    const enc = encodeURIComponent(rawHex);
    const attempts = [
      ['form', () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'raw=' + enc })],
      ['json', () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ raw: rawHex }) })],
      ['multipart', () => { const fd = new FormData(); fd.append('raw', rawHex); return fetch(url, { method: 'POST', body: fd }); }],
      ['query-post', () => fetch(`${url}?raw=${enc}`, { method: 'POST' })],
      ['query-get', () => fetch(`${url}?raw=${enc}`)]
    ];
    // Error yang menandakan server tidak membaca parameter (format request salah), bukan penolakan node
    const formatErr = /expected type|got null|got undefined|param|argument|no raw/i;
    const notes = [];
    for (const [name, attempt] of attempts) {
      let res;
      try { res = await attempt(); } catch (e) { notes.push(name + ': ' + e.message); continue; }
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch (e) {}
      if (json && typeof json === 'object' && ('result' in json || 'error' in json)) {
        if (json.error) {
          const msg = typeof json.error === 'object' ? (json.error.message || JSON.stringify(json.error)) : String(json.error);
          if (formatErr.test(msg)) { notes.push(name + ': ' + msg); continue; }
          // TX yang sama sudah ada di mempool/blok = sukses (bukan konflik)
          if (expectedTxid && !CONFLICT_RE.test(msg) && /already|known|duplicate/i.test(msg)) return expectedTxid;
          const err = new Error(msg);
          err.conflict = CONFLICT_RE.test(msg);
          throw err;
        }
        if (json.result) return String(json.result);
      }
      notes.push(`${name}: HTTP ${res.status} ${text.slice(0, 100)}`);
    }
    const cors = notes.some(n => /failed to fetch|networkerror|load failed/i.test(n))
      ? "\nKemungkinan diblokir CORS oleh browser: centang 'Hanya tanda tangani', lalu tempel raw TX ke halaman /broadcast di api.nusacoin.org."
      : "";
    const finalErr = new Error("Broadcast gagal.\n- " + notes.join("\n- ") + cors);
    finalErr.conflict = notes.some(n => CONFLICT_RE.test(n));
    throw finalErr;
  }

    async function fetchUtxos(address) {
      const enc = encodeURIComponent(address), notes = [];
      const sources = ['utxos', 'unspent', 'utxo', 'getutxo'].map(p => [p, async () => {
        const r = await fetch(`${NODE_API}/${p}/${enc}`); if (!r.ok) throw new Error('HTTP ' + r.status);
        return normalizeUtxos(await r.json(), address);
      }]);
      sources.push(['explorer', () => fetchUtxosFromExplorer(address)]);
      for (const [name, fn] of sources) {
        try {
          const list = await fn();
          if (!list) { notes.push(name + ': format tidak dikenali'); continue; }
          if (!utxoMatchesBalance(list)) { notes.push(name + ': total tidak cocok dengan saldo'); continue; }
          return list;
        } catch (e) { notes.push(name + ': ' + e.message); }
      }
      throw new Error('Tidak ada sumber UTXO yang valid.\n- ' + notes.join('\n- '));
    }

    // ===== Baca & cocokkan OP_RETURN (format apa pun) =====
    async function getOpReturns(txid) {
      try {
        const r = await fetch(`${API_BASE}/api/getrawtransaction?txid=${txid}&decrypt=1`);
        if (!r.ok) return null;
        const j = JSON.parse(await r.text());
        if (!j || !Array.isArray(j.vout)) return null;
        const out = [];
        for (const o of j.vout) {
          const hex = ((o.scriptPubKey || {}).hex || '').toLowerCase();
          if (!hex.startsWith('6a')) continue;
          let i = 2, data = '';
          while (i < hex.length) {
            const op = parseInt(hex.substr(i, 2), 16); i += 2;
            let len;
            if (op <= 75) len = op;
            else if (op === 0x4c) { len = parseInt(hex.substr(i, 2), 16); i += 2; }
            else if (op === 0x4d) { len = parseInt(hex.substr(i + 2, 2) + hex.substr(i, 2), 16); i += 4; }
            else break;
            data += hex.substr(i, len * 2); i += len * 2;
          }
          out.push(data);
        }
        return out;
      } catch (e) { return null; }
    }
    const hexToText = h => (h.match(/../g) || []).map(x => { const c = parseInt(x, 16); return c >= 32 && c < 127 ? String.fromCharCode(c) : '.'; }).join('');
    // cocok bila data = 32 byte hash mentah, atau teks OP_RETURN memuat hash 64 hex (awalan apa pun)
    const opMatches = (data, hash) => data === hash || hexToText(data).toLowerCase().includes(hash);

    async function mapPool(items, fn, n = 5) {
      let i = 0;
      await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) await fn(items[i++]); }));
    }

    // Cari TX yang OP_RETURN-nya memuat hash: alamat penerbit dulu, lalu pindai N blok terakhir
    async function findTxByHash(hash, addrs, nBlocks, progress) {
      let found = null;
      const check = async txid => { if (found) return; const ops = await getOpReturns(txid); if (ops && ops.some(d => opMatches(d, hash))) found = txid; };
      for (const a of addrs) {
        if (found) break;
        try {
          progress('Memeriksa alamat ' + a.slice(0, 12) + '...');
          const raw = await (await fetch(`${API_BASE}/ext/getaddresstxs/${a}/0/500`)).json();
          const arr = Array.isArray(raw) ? raw : (raw.data || raw.records || []);
          await mapPool([...new Set(arr.map(x => x.txid || (typeof x === 'string' ? x : null)).filter(Boolean))], check);
        } catch (e) {}
      }
      if (!found && nBlocks > 0) {
        try {
          const top = parseInt(await (await fetch(`${API_BASE}/api/getblockcount`)).text(), 10);
          const heights = Array.from({ length: nBlocks }, (_, k) => top - k).filter(h => h >= 0);
          let done = 0;
          await mapPool(heights, async h => {
            if (found) return;
            try {
              const bh = (await (await fetch(`${API_BASE}/api/getblockhash?index=${h}`)).text()).replace(/"/g, '').trim();
              const blk = await (await fetch(`${API_BASE}/api/getblock?hash=${bh}`)).json();
              await mapPool((blk.tx || []).slice(1).map(x => typeof x === 'string' ? x : x.txid), check, 3);
            } catch (e) {}
            progress(`Memindai blok... ${++done}/${heights.length}`);
          });
        } catch (e) {}
      }
      return found;
    }

function walletLogin() {
  let key = $('wKey').value.trim(); const pin = $('wPin').value.trim(); const type = $('wType').value;
  if (!key) { alert('Masukkan Private Key WIF, teks ENC, atau alamat Nusacoin.'); return; }
  if (isEncryptedText(key)) {
    if (!pin) { alert('PIN dibutuhkan untuk mendekripsi kunci ini.'); return; }
    try { key = CryptoJS.AES.decrypt(key.replace(/^ENC:/, ''), pin).toString(CryptoJS.enc.Utf8).trim(); } catch (e) { key = ''; }
    if (!key || (!isAddressText(key) && !isValidWif(key))) { alert('Gagal mendekripsi: PIN salah atau data tidak valid.'); return; }
  } else if (!isAddressText(key) && !isValidWif(key)) { alert('Private Key WIF tidak valid.'); return; }
  if (isAddressText(key)) { liveWalletData.pkey = null; liveWalletData.address = key; }
  else { liveWalletData.pkey = key; liveWalletData.address = getAddressFromWif(key, type); }
  $('wKey').value = ''; $('wPin').value = '';
  $('walletLogin').classList.add('hide'); $('walletActive').classList.remove('hide');
  $('wAddr').textContent = liveWalletData.address + (liveWalletData.pkey ? '' : '  (baca-saja)');
  refreshBalance();
}
function walletLogout() {
  liveWalletData = { pkey: null, address: null, balance: 0 }; pendingUtxos = []; pendingSpent.clear();
  $('walletActive').classList.add('hide'); $('walletLogin').classList.remove('hide');
}
async function refreshBalance() {
  const el = $('wBal'); el.textContent = '...';
  try { const res = await fetch(`${API_BASE}/ext/getbalance/${liveWalletData.address}`); if (!res.ok) throw new Error('HTTP ' + res.status);
    const n = parseFloat(await res.text()); liveWalletData.balance = isNaN(n) ? 0 : n; el.textContent = liveWalletData.balance + ' NUX';
  } catch (e) { el.textContent = 'gagal memuat saldo'; }
}

async function kirimPayload(payload, feeSats){
  const ownScript = addressToScriptHex(liveWalletData.address);
  const data = Array.from(new TextEncoder().encode(payload)).map(b => b.toString(16).padStart(2, '0')).join('');
  const opScript = '6a' + numToLEHex(data.length / 2, 1) + data;
  for (let attempt = 0; attempt < 3; attempt++) {
    let utxos = (await fetchUtxos(liveWalletData.address)).filter(u => !pendingSpent.has(u.txid + ':' + u.vout));
    pendingUtxos.filter(p => p.address === liveWalletData.address && !pendingSpent.has(p.txid + ':' + p.vout) && !utxos.some(u => u.txid === p.txid && u.vout === p.vout)).forEach(p => utxos.push({ txid: p.txid, vout: p.vout, value: p.value, confirmed: false }));
    utxos.sort((a, b) => ((a.confirmed === false) - (b.confirmed === false)) || (b.value - a.value));
    const selected = []; let acc = 0;
    for (const u of utxos) { selected.push(u); acc += u.value; if (acc >= feeSats) break; }
    if (acc < feeSats) throw new Error('Saldo tersedia tidak cukup untuk fee.');
    const outputs = [{ value: 0, script: opScript }]; let change = acc - feeSats;
    if (change >= DUST_SATS) outputs.push({ value: change, script: ownScript }); else change = 0;
    const { raw, txid } = buildSignedTransaction(selected, outputs, liveWalletData.pkey, ownScript);
    let sent;
    try { sent = await broadcastRawTx(NODE_API, raw, txid); }
    catch (e) { if (e.conflict && attempt < 2) { selected.forEach(u => pendingSpent.add(u.txid + ':' + u.vout)); continue; } throw e; }
    selected.forEach(u => pendingSpent.add(u.txid + ':' + u.vout));
    pendingUtxos = pendingUtxos.filter(p => !pendingSpent.has(p.txid + ':' + p.vout));
    if (change > 0) pendingUtxos.push({ address: liveWalletData.address, txid, vout: 1, value: change });
    return sent;
  }
  throw new Error('Broadcast gagal setelah 3 percobaan.');
}

const CODES = { I:'dI', T:'dT', S:'dS', P:'dP' }, CAT = { A:['I','T'], N:['S','P'] };
function fillJenis(){
  [['kJenis', 'ITSP'], ['dJenis', CAT[curCat].join('')]].forEach(([id, cs]) => { const s = $(id), v = s.value; s.innerHTML = ''; [...cs].forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = t(CODES[c]); s.appendChild(o); }); if(v && cs.indexOf(v) >= 0) s.value = v; });
}
function show(w){ ['V','K','A'].forEach(k => { $(k).classList.toggle('hide', k !== w); $('tab' + k).classList.toggle('alt', k !== w); }); }
function openVerif(cat, scan){
  curCat = cat; $('pick').classList.add('hide'); $('verifPanel').classList.remove('hide'); $('vTitle').textContent = t(cat === 'A' ? 'acadD' : 'nonacadD'); fillJenis();
  $('vofc').value = $('vofc').value || KAMPUS.alamatResmi; if(scan) mulaiScan();
}
function backPick(){ hentiScan(); $('verifPanel').classList.add('hide'); $('pick').classList.remove('hide'); $('hasilV').innerHTML = ''; $('msgV').innerHTML = ''; }
function note(el, cls, tx){ const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = tx; $(el).innerHTML = ''; $(el).appendChild(d); }
function el(tag, tx, cls, parent){ const e = document.createElement(tag); if(tx != null) e.textContent = tx; if(cls) e.className = cls; if(parent) parent.appendChild(e); return e; }
const eq = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
const addrsOf = o => { const sp = (o && o.scriptPubKey) || {}; return [].concat(sp.addresses || [], sp.address ? [sp.address] : []).map(String); };
async function sha(buf){ return [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join(''); }
const waktu = tm => tm ? new Date(tm * 1000).toLocaleString(lang ? 'en-GB' : 'id-ID', { timeZone:'Asia/Jakarta', dateStyle:'full', timeStyle:'long' }) : t('pending');
const kanon = (code, f) => JSON.stringify([code, f.no, f.id, f.nama, f.prodi, f.tgl, f.ket].map(x => String(x || '').trim()));
const hashForm = (code, f) => sha(new TextEncoder().encode(kanon(code, f)));
const txc = {};
async function rawTx(id){ if(txc[id]) return txc[id]; const r = await fetch(API_BASE + '/api/getrawtransaction?txid=' + id + '&decrypt=1'); if(!r.ok) throw new Error('HTTP ' + r.status); return (txc[id] = JSON.parse(await r.text())); }
async function infoTx(txid){
  const j = await rawTx(txid), senders = [];
  for(const vi of (j.vin || [])){ if(!vi.txid) continue; try{ addrsOf(((await rawTx(vi.txid)).vout || [])[vi.vout]).forEach(a => senders.push(a)); }catch(e){} }
  return { time:j.blocktime || null, conf:j.confirmations || 0, senders };
}

async function siapkan(){
  const code = $('kJenis').value, f = { no:$('kNo').value, id:$('kId').value, nama:$('kNama').value, prodi:$('kProdi').value, tgl:$('kTgl').value, ket:$('kKet').value };
  const file = $('kFile').files[0];
  if(!file && (!f.no.trim() || !f.nama.trim())) return note('msgK', 'bad', lang ? 'Fill in the document number and holder name, or choose a file.' : 'Isi nomor dokumen dan nama pemilik, atau pilih file.');
  const h = file ? await sha(await file.arrayBuffer()) : await hashForm(code, f);
  cur = { code, f, hash:h, mode:file ? 'f' : 'd', payload:'UCH1:' + code + ':' + h };
  $('h').textContent = h + (file ? '  (file)' : '  (data)'); $('pl').textContent = cur.payload + ' (' + cur.payload.length + ' byte)';
  $('hasilHash').classList.remove('hide'); $('msgK').innerHTML = '';
}
async function terbitkan(){
  if(!cur) return;
  const fee = parseFloat($('kFee').value);
  if(!liveWalletData.pkey){ alert(lang ? 'Log in with a WIF private key first.' : 'Login dengan Private Key WIF dulu.'); return; }
  if(!(fee > 0)){ alert('Fee?'); return; }
  if(!confirm((lang ? 'Anchor this document hash to the Nusacoin blockchain?' : 'Tambatkan hash dokumen ke blockchain Nusacoin?') + '\n\n' + cur.payload + '\nFee: ' + fee + ' NUX\n\n' + (lang ? 'Irreversible.' : 'Tidak bisa dibatalkan.'))) return;
  const b = $('btnInject'); b.disabled = true; note('msgK', '', '...');
  try{ cur.txid = await kirimPayload(cur.payload, Math.round(fee * 1e8)); cur.issuer = liveWalletData.address; note('msgK', 'ok', 'TXID: ' + cur.txid); tampilBukti(); setTimeout(refreshBalance, 3000); }
  catch(e){ note('msgK', 'bad', e.message); } finally{ b.disabled = false; }
}
function tampilBukti(){
  const box = $('certBox'); box.innerHTML = '';
  el('h2', t(CODES[cur.code]) + ' - Universitas Nusa', null, box);
  if(cur.f.nama) el('h3', cur.f.nama, null, box);
  if(cur.f.no) el('div', 'No. ' + cur.f.no, null, box);
  el('div', 'Hash: ' + cur.hash, 'mono', box); el('div', 'TXID: ' + cur.txid, 'mono', box);
  $('qr').innerHTML = '';
  try{ new QRCode($('qr'), { text: location.href.split('#')[0] + '#tx=' + cur.txid + '&h=' + cur.hash + '&t=' + cur.code + '&m=' + cur.mode, width:220, height:220, correctLevel: QRCode.CorrectLevel.L }); }catch(e){}
  $('certOut').classList.remove('hide');
}
function unduh(){
  const b = new Blob([JSON.stringify({ v:1, mode:'univchain', kode:cur.code, cara:cur.mode, hash:cur.hash, txid:cur.txid, penerbit:cur.issuer, data:cur.f }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'univchain-' + cur.hash.slice(0, 8) + '.json'; a.click();
}
async function cabut(){
  const h = $('rHash').value.trim().toLowerCase(), fee = parseFloat($('kFee').value);
  if(!/^[0-9a-f]{64}$/.test(h)) return note('msgR', 'bad', 'Hash?');
  if(!liveWalletData.pkey){ alert(lang ? 'Log in with a WIF private key first.' : 'Login dengan Private Key WIF dulu.'); return; }
  if(!confirm((lang ? 'Revoke this document?' : 'Cabut dokumen ini?') + '\n\n' + h)) return;
  try{ note('msgR', 'ok', 'TXID: ' + await kirimPayload('UCH1:R:' + h, Math.round(fee * 1e8))); setTimeout(refreshBalance, 3000); }catch(e){ note('msgR', 'bad', e.message); }
}

function hasil(kind, title, rows){
  const c = el('div', null, 'res ' + kind, (() => { const o = $('hasilV'); o.innerHTML = ''; return o; })()); el('h2', title, null, c);
  rows.forEach(r => { const d = el('div', null, 'row2', c); el('span', r[0], 'lab', d); el('span', r[1], 'mono', d); });
}
async function verifikasi(){
  $('hasilV').innerHTML = ''; $('msgV').innerHTML = '';
  const official = $('vofc').value.trim() || KAMPUS.alamatResmi, mh = $('vhash').value.trim().toLowerCase(), f = $('vfile').files[0];
  let txid = $('vtx').value.trim().toLowerCase(); const cands = [];
  try{
    if(f){
      const buf = await f.arrayBuffer(); let j = null; try{ j = JSON.parse(new TextDecoder().decode(buf)); }catch(_){}
      if(j && j.mode === 'univchain' && j.hash){ cands.push({ h:String(j.hash).toLowerCase(), via:'vManual' }); txid = txid || j.txid || ''; }
      else cands.push({ h:await sha(buf), via:'vFile' });
    }
    if(/^[0-9a-f]{64}$/.test(mh)) cands.push({ h:mh, via:'vManual' });
    const fd = { no:$('dNo').value, id:$('dId').value, nama:$('dNama').value, prodi:$('dProdi').value, tgl:$('dTgl').value, ket:$('dKet').value };
    if(fd.no.trim() && fd.nama.trim()) cands.push({ h:await hashForm($('dJenis').value, fd), via:'vData' });
    if(!cands.length) return note('msgV', 'bad', t('rNoInput'));
    if(!txid){
      for(const c of cands){ note('msgV', '', '...'); txid = await findTxByHash(c.h, official ? [official] : [], parseInt($('vblk').value, 10) || 0, p => note('msgV', '', p)); if(txid) break; }
      if(!txid) return hasil('bad', t('rInvalid'), [['', t('rNotFound')]]);
    }
    note('msgV', '', '...');
    const ops = await getOpReturns(txid); if(ops === null) return note('msgV', 'bad', 'TX?');
    const m = ops.map(hexToText).map(x => x.match(/^UCH1:([ITSPR]):([0-9a-f]{64})$/i)).find(Boolean);
    if(!m) return hasil('bad', t('rInvalid'), [['TXID', txid], ['', t('notUch')]]);
    const code = m[1].toUpperCase(), ch = m[2].toLowerCase();
    if(code === 'R') return hasil('bad', t('rRevoked'), [['TXID', txid], ['Hash', ch]]);
    const hit = cands.find(c => c.h === ch), info = await infoTx(txid);
    const rows = [[t('lType'), t(CODES[code])], ['Hash', ch], [t('lTime'), waktu(info.time)], ['TXID', txid], [t('lIssuer'), info.senders[0] || '-']];
    if(!hit) return hasil('bad', t('rInvalid'), rows.concat([['', lang ? 'The document/data hash does not match the one anchored for this TXID.' : 'Hash dokumen/data tidak cocok dengan hash yang ditambatkan pada TXID ini.']]));
    rows.push([t('lVia'), t(hit.via)]);
    const ok = official ? info.senders.some(a => eq(a, official)) : null;
    rows.push([t('lOfcMatch'), ok === null ? t('unk') : ok ? t('yes') : t('no')]);
    if(CAT[curCat].indexOf(code) < 0) rows.push(['', t('catWarn')]);
    if(ok === false) return hasil('bad', t('rInvalid'), rows);
    if(ok){
      note('msgV', '', lang ? 'Checking revocation...' : 'Memeriksa pencabutan...');
      const rev = await cekCabut(ch, official);
      if(rev) return hasil('bad', t('rRevoked'), rows);
    }
    $('msgV').innerHTML = ''; hasil(ok ? 'ok' : 'warn', ok ? t('rValid') : t('rUnsure'), rows);
  }catch(e){ note('msgV', 'bad', e.message); }
}
async function cekCabut(hash, official){
  let ids = []; try{ const raw = await (await fetch(API_BASE + '/ext/getaddresstxs/' + official + '/0/300')).json(); ids = [...new Set((Array.isArray(raw) ? raw : (raw.data || raw.records || [])).map(x => x.txid || (typeof x === 'string' ? x : null)).filter(Boolean))]; }catch(e){}
  const hits = []; await mapPool(ids, async id => { const ops = await getOpReturns(id); if(ops && ops.some(d => hexToText(d).toLowerCase() === 'uch1:r:' + hash)) hits.push(id); }, 6);
  for(const id of hits){ try{ if((await infoTx(id)).senders.some(a => eq(a, official))) return true; }catch(e){} }
  return false;
}
let camStream = null, camOn = false;
function parseQR(t){ t = String(t); const a = t.match(/tx=([0-9a-fA-F]{64})/), b = t.match(/[?&#]h=([0-9a-fA-F]{64})/); return a && b ? { tx:a[1].toLowerCase(), h:b[1].toLowerCase() } : null; }
function scanCanvas(c){ const id = c.getContext('2d').getImageData(0, 0, c.width, c.height); const r = jsQR(id.data, id.width, id.height, { inversionAttempts:'attemptBoth' }); return r ? parseQR(r.data) : null; }
function muatSkrip(u){ return new Promise((ok, err) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = () => err(new Error('gagal memuat ' + u)); document.head.appendChild(s); }); }
async function pastikanJsQR(){
  if(typeof jsQR === 'function') return true;
  for(const u of ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js']){
    try{ await muatSkrip(u); if(typeof jsQR === 'function') return true; }catch(e){}
  }
  return false;
}
function hasilScan(q){ $('vtx').value = q.tx; $('vhash').value = q.h; $('vfile').value = ''; verifikasi(); }
async function scanFoto(){
  const f = $('vqr').files[0]; if(!f) return;
  try{
    if(!(await pastikanJsQR())) throw new Error('Pustaka pemindai QR (jsQR) gagal dimuat. Periksa koneksi atau pemblokir iklan, lalu muat ulang halaman.');
    const bm = await createImageBitmap(f), c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height; c.getContext('2d').drawImage(bm, 0, 0);
    const q = scanCanvas(c);
    if(!q) return note('msgV', 'bad', 'QR bukti tidak terbaca dari foto ini. Coba foto yang lebih jelas, tidak miring, dengan QR memenuhi sebagian besar bingkai.');
    hasilScan(q);
  }catch(e){ note('msgV', 'bad', e.message); }
}
async function mulaiScan(){
  const v = $('cam');
  try{ camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
  catch(e){ return note('msgV', 'bad', 'Kamera tidak bisa dibuka: ' + e.message + '. Izinkan akses kamera (butuh HTTPS), atau unggah foto QR.'); }
  v.srcObject = camStream; await v.play(); $('camBox').classList.remove('hide'); camOn = true;
  const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently:true });
  const bd = window.BarcodeDetector ? new BarcodeDetector({ formats:['qr_code'] }) : null;
  const status = t => { $('camStat').textContent = t; };
  let last = 0, n = 0;
  const loop = async () => {
    if(!camOn) return;
    const now = performance.now();
    if(now - last > 200 && v.readyState >= 2 && v.videoWidth){
      last = now; n++;
      try{
        let text = null;
        if(bd){ const r = await bd.detect(v); if(r.length) text = r[0].rawValue; }
        if(!text){
          if(typeof jsQR !== 'function' && !(await pastikanJsQR())) throw new Error('Pustaka pemindai QR (jsQR) gagal dimuat dari semua sumber. Periksa koneksi atau pemblokir iklan, lalu muat ulang halaman.');
          const sc = Math.min(1, 900 / v.videoWidth);
          c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc); x.drawImage(v, 0, 0, c.width, c.height);
          const id = x.getImageData(0, 0, c.width, c.height), r = jsQR(id.data, id.width, id.height, { inversionAttempts:'attemptBoth' });
          if(r) text = r.data;
        }
        if(text){
          const q = parseQR(text);
          if(q){ hentiScan(); hasilScan(q); return; }
          status('QR terbaca tetapi bukan bukti Nusachain: ' + text.slice(0, 60));
        } else status('Mencari QR... (' + n + ' frame diperiksa, ' + v.videoWidth + 'x' + v.videoHeight + '). Dekatkan, tahan stabil, hindari pantulan.');
      }catch(e){ status('Error pemindai: ' + e.message); if(/jsQR/.test(e.message)) return; }
    }
    requestAnimationFrame(loop);
  };
  loop();
}
function hentiScan(){ camOn = false; if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } $('camBox').classList.add('hide'); }

async function muatBlok(){
  const b = $('blkNum'), d = $('blkDot');
  try{ const r = await fetch(API_BASE + '/api/getblockcount'); if(!r.ok) throw new Error('x'); const n = parseInt(await r.text(), 10); if(isNaN(n)) throw new Error('x'); b.textContent = n.toLocaleString(lang ? 'en-US' : 'id-ID'); d.style.background = 'var(--ok)'; }
  catch(e){ b.textContent = '-'; d.style.background = 'var(--mut)'; }
}
muatBlok(); setInterval(muatBlok, 60000);
(function(){
  try{ const th = localStorage.getItem('uc_theme'); setTheme(th ? th === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ setTheme(false); }
  let l = 0; try{ l = parseInt(localStorage.getItem('uc_lang'), 10) || 0; }catch(e){} setLang(l);
  const m = location.hash.match(/tx=([0-9a-fA-F]{64})/), g = location.hash.match(/[#&]h=([0-9a-fA-F]{64})/), ty = location.hash.match(/[#&]t=([ITSP])/);
  if(m && g){ openVerif(ty && 'TI'.indexOf(ty[1]) < 0 && 'IT'.indexOf(ty[1]) < 0 ? 'N' : 'A', false); $('vtx').value = m[1]; $('vhash').value = g[1]; verifikasi(); }
})();
