    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --bg-card-sub: #252526;
            --text-main: #e0e0e0;
            --text-sub: #9da3a6;
            --border: #333333;
            --primary: #0ad161;
            --primary-dark: #089c48;
        }

        body.light-mode {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --bg-card-sub: #f1f5f9;
            --text-main: #212529;
            --text-sub: #6c757d;
            --border: #dee2e6;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-top: 80px;
            padding-bottom: 70px;
        }

        .navbar-custom {
            background-color: #181818 !important;
            border-bottom: 1px solid var(--border);
        }

        body.light-mode .navbar-custom {
            background-color: #1a252f !important;
        }

        .endpoint-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .card-top-action {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }

        .endpoint-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .method {
            background-color: var(--primary);
            color: #121212;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .method.post {
            background-color: #ff8c00;
            color: #121212;
        }

        .endpoint-path {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4fdee5;
        }

        .endpoint-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 0.75rem;
            margin-bottom: 0.35rem;
        }

        .box-container {
            position: relative;
            background-color: var(--bg-card-sub);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            color: #1e90ff;
        }

        body.light-mode .box-container {
            color: #0056b3;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
            font-weight: 600;
        }

        .btn-copy:hover {
            background: var(--primary);
            color: #121212;
            border-color: var(--primary);
        }

        .btn-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border);
            color: white;
            padding: 0.35rem 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 15px;
        }

        .btn-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Notifikasi Toast */
        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: fixed;
            z-index: 1050;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.9rem;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 1.7s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }

        /* Syntax highlighting tema blackboard */
        .json-editor-blackbord {
            background: #181818;
            color: #fff;
            font-size: 13px;
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        body.light-mode .json-editor-blackbord {
            background: #202020;
            color: #fff;
        }
        ul.json-dict, ol.json-array {
            list-style-type: none;
            margin: 0 0 0 1px;
            border-left: 1px dotted #525252;
            padding-left: 2em;
        }
        .json-string { color: #0ad161; }
        .json-literal { color: #ff8c00; }
        .json-url { color: #1e90ff; }
        .json-property { color: #4fdee5; line-height: 160%; font-weight: 500; }
        a.json-toggle { position: relative; color: inherit; text-decoration: none; cursor: pointer; }
        a.json-toggle:before { color: #aaa; content: "\25BC"; position: absolute; display: inline-block; width: 1em; left: -1em; }
        a.json-toggle.collapsed:before { transform: rotate(-90deg); -ms-transform: rotate(-90deg); -webkit-transform: rotate(-90deg); }
        a.json-placeholder { color: #aaa; padding: 0 1em; text-decoration: none; cursor: pointer; }
        a.json-placeholder:hover { text-decoration: underline; }
    </style>
</head>

                    <div class="endpoint-header">
                        <span class="${methodClass}" id="method-${index}">${item.method}</span>
                        <span class="endpoint-path" id="path-${index}">${item.name}</span>
                    </div>
                    <div class="endpoint-desc" id="desc-${index}">${item.description}</div>
                    
                    <div class="section-title">URL Endpoint:</div>
                    <div class="box-container" id="url-${index}"><span>${fullUrl}</span></div>

                    <div class="section-title">Contoh Respon JSON:</div>
                    <div class="json-viewer-container" id="json-viewer-${index}"></div>
                </div>
            `;
            $docs.append(cardHtml);

            if (item.response) {
                new JsonEditor('#json-viewer-' + index, item.response);
            }
        });

        function copyPackage(index) {
            var item = api[index];
            var fullUrl = uri + item.example;
            var jsonString = JSON.stringify(item.response, null, 4);
            
            var packageText = item.method + ' ' + item.name + '\n' +
                              item.description + '\n' +
                              fullUrl + '\n\n' +
                              jsonString;

            navigator.clipboard.writeText(packageText).then(() => {
                showToast();
                var btn = $('#card-' + index).find('.btn-copy');
                var originalHTML = btn.html();
                btn.html('<i class="fa-solid fa-check"></i> Paket Tersalin!').css({'background-color': 'var(--primary)', 'color': '#121212', 'border-color': 'var(--primary)'});
                setTimeout(() => {
                    btn.html(originalHTML).css({'background-color': '', 'color': '', 'border-color': ''});
                }, 1500);
            }).catch(err => {
                console.error('Gagal menyalin: ', err);
            });
        }

        function showToast() {
            var toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
        }

        function toggleTheme() {
            var body = document.body;
            var icon = document.getElementById('themeIcon');
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                icon.className = 'fa-solid fa-moon';
            } else {
                icon.className = 'fa-solid fa-sun';
            }
        }
    </script>
</body>
</html>
