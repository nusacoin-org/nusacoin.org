<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusacoin Paper Wallet Card Generator</title>
  
  <!-- CDN QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- CDN html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* DEFINISI COLOR TOKENS */
    :root {
      /* Brand Colors */
      --nux-green: #27ae60;
      --nux-green-dark: #1e8449;
      --nux-green-deep: #0f3d26;
      --gold: #d4a017;

      /* Hardcoded / Utility Colors */
      --white: #ffffff;
      --green-pale: #eafff2;

      /* Transparencies */
      --green-ring: rgba(39, 174, 96, 0.18);
      --green-shadow: rgba(39, 174, 96, 0.55);
      --deep-shadow: rgba(15, 61, 38, 0.55);

      /* Light Mode Tokens */
      --bg: #f7f5ef;
      --surface: #ffffff;
      --surface-2: #f0efe6;
      --ink: #16231c;
      --ink-soft: #56645c;
      --border: #e3ded0;
      --shadow: rgba(15, 61, 38, 0.18);
    }

    html[data-theme="dark"] {
      /* Dark Mode Tokens */
      --bg: #0d1712;
      --surface: #142219;
      --surface-2: #182a1e;
      --ink: #eef3ec;
      --ink-soft: #9db3a4;
      --border: #24382c;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 20px 10px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* CONTROL BAR (LANG & THEME) */
    .controls-container {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switcher {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--ink-soft);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--nux-green);
      color: var(--white);
    }

    .theme-toggle-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .theme-toggle-btn:hover {
      background: var(--border);
    }

    /* CONTAINER UTAMA RATA TENGAH */
    .generator-wrapper {
      margin: 0 auto !important;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center !important;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    /* HEADER APP */
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      width: 100%;
    }
    
    .app-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin: 0 auto 12px auto;
      display: block;
    }

    .app-header h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      color: var(--nux-green);
      letter-spacing: 0.5px;
    }
    .app-header p {
      margin: 0;
      font-size: 14px;
      color: var(--ink-soft);
    }

    /* FORM CONTAINER */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      margin-left: auto !important;
      margin-right: auto !important;
      margin-top: 0;
      margin-bottom: 32px;
      box-shadow: 0 10px 25px -5px var(--shadow);
      text-align: left;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-card label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-card input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: monospace;
    }

    .form-card input:focus {
      border-color: var(--nux-green);
      box-shadow: 0 0 0 3px var(--green-ring);
    }

    .toggle-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .toggle-btn:hover {
      color: var(--ink);
      background: var(--border);
    }

    .security-banner {
      background: var(--green-pale);
      border: 1px solid var(--nux-green);
      color: var(--nux-green-dark);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    html[data-theme="dark"] .security-banner {
      background: var(--nux-green-deep);
      border-color: var(--nux-green-dark);
      color: var(--green-pale);
    }

    /* BUTTON GROUP */
    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-download {
      background: var(--nux-green);
      color: var(--white);
    }

    .btn-download:hover {
      background: var(--nux-green-dark);
    }

    /* PREVIEW CONTAINER */
    .preview-title {
      font-size: 14px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 600;
    }

    /* KONTEN KARTU */
    .print-sheet {
      display: flex;
      flex-direction: row;
      width: 647px;
      height: 204px;
      box-shadow: 0 15px 30px var(--shadow);
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto !important;
      background: transparent;
      position: relative;
    }

    .card-half {
      position: relative;
      width: 323.5px;
      height: 204px;
      overflow: hidden;
    }

    .card-bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .divider {
      position: absolute;
      left: 323.5px;
      top: 0;
      bottom: 0;
      width: 1px;
      border-left: 1px dashed rgba(255,255,255,0.4);
      z-index: 3;
    }

    /* CONTAINER AREA TEKS */
    .text-content-left {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 180px;
      text-align: left;
      z-index: 2;
    }

    /* OVERLAY ELEMENT - KARTU DEPAN */
    .overlay-public-qr {
      position: absolute;
      right: 22px;
      top: 90px;
      width: 82px;
      height: 82px;
      background: #ffffff;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .overlay-public-name {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .overlay-public-address {
      font-family: monospace;
      font-size: 8px;
      color: #e2e8f0;
      word-break: break-all;
      line-height: 1.2;
    }

    /* OVERLAY ELEMENT - KARTU BELAKANG */
    .overlay-private-qr {
      position: absolute;
      right: 22px;
      top: 90px;
      width: 82px;
      height: 82px;
      background: #ffffff;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .overlay-private-key {
      font-family: monospace;
      font-size: 8px;
      color: #e2e8f0;
      word-break: break-all;
      line-height: 1.2;
    }

    .qr-box canvas, .qr-box img {
      width: 74px !important;
      height: 74px !important;
      display: block;
    }
  </style>
</head>
<body>

<div class="controls-container">
  <div class="lang-switcher">
    <button id="btnIN" class="lang-btn active" onclick="setLanguage('id')">IN</button>
    <button id="btnEN" class="lang-btn" onclick="setLanguage('en')">EN</button>
  </div>
  <button onclick="toggleTheme()" class="theme-toggle-btn" id="themeBtn">
    <i id="theme-icon" class="fa-solid fa-sun"></i>
    <span id="theme-text">Light</span>
  </button>
</div>

<div class="generator-wrapper">

  <!-- HEADER -->
  <div class="app-header">
    <img src="https://iili.io/CNJKhKu.th.png" alt="Nusacoin Logo" class="app-logo">
    <h1 id="appTitle">Nusacoin Wallet Generator</h1>
    <p id="appDesc">Generator Paper Wallet Kartu (Eksport Gambar PNG)</p>
  </div>

  <!-- FORM INPUT -->
  <div class="form-card">
    <div id="securityBanner" class="security-banner">
      🛡️ <strong>Keamanan Terjamin:</strong> Data diproses 100% di browser Anda tanpa disimpan di server manapun.
    </div>

    <div class="form-group">
      <label id="lblInputName" for="inputName">Nama Pemilik Kartu</label>
      <div class="input-wrapper">
        <input type="text" id="inputName" placeholder="Masukkan nama pemilik..." value="" style="font-family: sans-serif;">
      </div>
    </div>

    <div class="form-group">
      <label id="lblInputAddress" for="inputAddress">Alamat Wallet (Public Address)</label>
      <div class="input-wrapper">
        <input type="text" id="inputAddress" placeholder="Masukkan public address (nu1q...)" value="">
      </div>
    </div>

    <div class="form-group">
      <label id="lblInputPkey" for="inputPkey">Private Key</label>
      <div class="input-wrapper">
        <input type="password" id="inputPkey" placeholder="Masukkan private key..." value="">
        <button type="button" class="toggle-btn" id="togglePkey">Show</button>
      </div>
    </div>

    <div class="button-group">
      <button class="btn btn-download" id="btnDownload" onclick="downloadImage()">📸 Unduh Kartu (PNG)</button>
    </div>
  </div>

  <div id="previewTitle" class="preview-title">PREVIEW KARTU DEPAN & BELAKANG</div>

  <!-- HASIL KARTU DEPAN & BELAKANG -->
  <div class="print-sheet" id="cardSheet">
    
    <!-- KARTU SISI DEPAN -->
    <div class="card-half">
      <img src="https://i.ibb.co.com/8LMbPhqY/KARTU-DEPAN.jpg" crossorigin="anonymous" class="card-bg-img" alt="Kartu Depan">
      <div class="overlay-public-qr qr-box" id="qrPublic"></div>
      
      <!-- AREA TEKS DEPAN -->
      <div class="text-content-left">
        <div class="overlay-public-name" id="displayName">-</div>
        <div class="overlay-public-address" id="displayAddress">-</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- KARTU SISI BELAKANG -->
    <div class="card-half">
      <img src="https://i.ibb.co.com/G4SqY4Nb/KART-BELAKANG.jpg" crossorigin="anonymous" class="card-bg-img" alt="Kartu Belakang">
      <div class="overlay-private-qr qr-box" id="qrPrivate"></div>
      
      <!-- AREA TEKS BELAKANG -->
      <div class="text-content-left">
        <div class="overlay-private-key" id="displayPkey">-</div>
      </div>
    </div>

  </div>

</div>

  <!-- LOGIKA JAVASCRIPT -->
  <script>
    let currentLang = 'id';

    const translations = {
      id: {
        appTitle: "Nusacoin Wallet Generator",
        appDesc: "Generator Paper Wallet Kartu (Eksport Gambar PNG)",
        securityBanner: "🛡️ <strong>Keamanan Terjamin:</strong> Data diproses 100% di browser Anda tanpa disimpan di server manapun.",
        lblInputName: "Nama Pemilik Kartu",
        phName: "Masukkan nama pemilik...",
        lblInputAddress: "Alamat Wallet (Public Address)",
        phAddress: "Masukkan public address (nu1q...)",
        lblInputPkey: "Private Key",
        phPkey: "Masukkan private key...",
        btnShow: "Show",
        btnHide: "Hide",
        btnDownload: "📸 Unduh Kartu (PNG)",
        btnProcessing: "⏳ Memproses Gambar...",
        previewTitle: "PREVIEW KARTU DEPAN & BELAKANG",
        errDownload: "Gagal mengunduh gambar."
      },
      en: {
        appTitle: "Nusacoin Wallet Generator",
        appDesc: "Card Paper Wallet Generator (Export PNG Image)",
        securityBanner: "🛡️ <strong>Guaranteed Security:</strong> Data is processed 100% in your browser without being stored on any server.",
        lblInputName: "Cardholder Name",
        phName: "Enter cardholder name...",
        lblInputAddress: "Wallet Address (Public Address)",
        phAddress: "Enter public address (nu1q...)",
        lblInputPkey: "Private Key",
        phPkey: "Enter private key...",
        btnShow: "Show",
        btnHide: "Hide",
        btnDownload: "📸 Download Card (PNG)",
        btnProcessing: "⏳ Processing Image...",
        previewTitle: "FRONT & BACK CARD PREVIEW",
        errDownload: "Failed to download image."
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('btnIN').classList.toggle('active', lang === 'id');
      document.getElementById('btnEN').classList.toggle('active', lang === 'en');

      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('appDesc').textContent = t.appDesc;
      document.getElementById('securityBanner').innerHTML = t.securityBanner;
      document.getElementById('lblInputName').textContent = t.lblInputName;
      document.getElementById('inputName').placeholder = t.phName;
      document.getElementById('lblInputAddress').textContent = t.lblInputAddress;
      document.getElementById('inputAddress').placeholder = t.phAddress;
      document.getElementById('lblInputPkey').textContent = t.lblInputPkey;
      document.getElementById('inputPkey').placeholder = t.phPkey;
      
      const toggleBtn = document.getElementById("togglePkey");
      if (pkeyInput.type === "password") {
        toggleBtn.textContent = t.btnShow;
      } else {
        toggleBtn.textContent = t.btnHide;
      }

      document.getElementById('btnDownload').textContent = t.btnDownload;
      document.getElementById('previewTitle').textContent = t.previewTitle;
    }

    // Logika Switching Theme (Light / Dark)
    function toggleTheme() {
      const htmlTag = document.documentElement;
      const currentTheme = htmlTag.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlTag.setAttribute('data-theme', newTheme);
      
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');

      if (newTheme === 'dark') {
        icon.className = 'fa-solid fa-moon';
        text.innerText = 'Dark';
      } else {
        icon.className = 'fa-solid fa-sun';
        text.innerText = 'Light';
      }
    }

    // Inisialisasi QR Code
    let qrPublicInstance = new QRCode(document.getElementById("qrPublic"), {
      width: 128,
      height: 128,
      correctLevel: QRCode.CorrectLevel.M
    });

    let qrPrivateInstance = new QRCode(document.getElementById("qrPrivate"), {
      width: 128,
      height: 128,
      correctLevel: QRCode.CorrectLevel.M
    });

    // Update Kartu
    function updateCard() {
      const name = document.getElementById("inputName").value.trim() || "-";
      const address = document.getElementById("inputAddress").value.trim() || "-";
      const pkey = document.getElementById("inputPkey").value.trim() || "-";

      document.getElementById("displayName").textContent = name;
      document.getElementById("displayAddress").textContent = address;
      document.getElementById("displayPkey").textContent = pkey;

      qrPublicInstance.clear();
      qrPublicInstance.makeCode(address);

      qrPrivateInstance.clear();
      qrPrivateInstance.makeCode(pkey);
    }

    // Toggle Password
    const toggleBtn = document.getElementById("togglePkey");
    const pkeyInput = document.getElementById("inputPkey");

    toggleBtn.addEventListener("click", () => {
      const t = translations[currentLang];
      if (pkeyInput.type === "password") {
        pkeyInput.type = "text";
        toggleBtn.textContent = t.btnHide;
      } else {
        pkeyInput.type = "password";
        toggleBtn.textContent = t.btnShow;
      }
    });

    // Fungsi Unduh Gambar
    function downloadImage() {
      const t = translations[currentLang];
      const btn = document.getElementById('btnDownload');
      btn.textContent = t.btnProcessing;
      btn.disabled = true;

      const element = document.getElementById('cardSheet');
      const holderName = document.getElementById('inputName').value.trim() || 'Nusacoin';

      html2canvas(element, {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        backgroundColor: null
      }).then(canvas => {
        const imageURL = canvas.toDataURL("image/png");

        const downloadLink = document.createElement("a");
        downloadLink.href = imageURL;
        downloadLink.download = `Nusacoin_Card_${holderName}.png`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        btn.textContent = t.btnDownload;
        btn.disabled = false;
      }).catch(err => {
        console.error("Gagal mengunduh gambar:", err);
        alert(t.errDownload);
        btn.textContent = t.btnDownload;
        btn.disabled = false;
      });
    }

    document.getElementById("inputName").addEventListener("input", updateCard);
    document.getElementById("inputAddress").addEventListener("input", updateCard);
    document.getElementById("inputPkey").addEventListener("input", updateCard);

    window.addEventListener("DOMContentLoaded", updateCard);
  </script>
</body>
</html>
