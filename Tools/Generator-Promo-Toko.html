<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Banner &amp; Kupon Promo Toko – ELNUX</title>
<style>
:root{color-scheme:dark;--bg:#031c0e;--card:#0a2e18;--line:#1d5a36;--text:#eaf5ee;--muted:#a9c9b4;--orange:#e6c35c;--teal:#8fe3a8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,#14683a55,transparent),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 40px}
h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px)}h1 span{color:var(--orange)}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:20px;grid-template-columns:340px 1fr;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--text)}.chk input{width:auto}
.btn{margin-top:16px;width:100%;background:var(--orange);color:#1a1400;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:12px;cursor:pointer}
.prev{display:grid;place-items:center;background:#021409;border:1px solid var(--line);border-radius:16px;padding:16px}
canvas{max-width:100%;max-height:78vh;height:auto;width:auto;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.note{color:var(--muted);font-size:13px;margin-top:10px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Generator <span>banner &amp; kupon</span> promo toko</h1>
  <p class="sub">Isi data toko, lihat hasilnya langsung, lalu unduh sebagai gambar PNG.</p>
  <div class="grid">
    <div class="card">
      <label for="toko">Nama toko</label>
      <input id="toko" value="Kopi Senja" maxlength="40">
      <label for="judul">Judul promo</label>
      <textarea id="judul" maxlength="80">Ngopi hemat, poin makin banyak!</textarea>
      <label for="ket">Keterangan / syarat (opsional)</label>
      <textarea id="ket" maxlength="120">Berlaku untuk semua menu. Tidak digabung dengan promo lain.</textarea>
      <div class="row">
        <div><label for="bonus">Bonus poin (%)</label><input id="bonus" type="number" min="0.1" max="100" step="0.1" value="5"></div>
        <div><label for="tgl">Berlaku sampai</label><input id="tgl" type="date"></div>
      </div>
      <div class="row">
        <div><label for="fmt">Format</label>
          <select id="fmt"><option value="post">Post 1080×1080</option><option value="story">Story 1080×1920</option><option value="kupon">Kupon cetak 1800×800</option></select></div>
        <div><label for="tema">Tema</label>
          <select id="tema"><option value="nusachain">Nusachain (hijau &amp; emas)</option><option value="navy">Navy &amp; oranye</option><option value="hijau">Hijau &amp; kuning</option><option value="krem">Krem &amp; merah</option></select></div>
      </div>
      <label class="chk"><input id="contoh" type="checkbox" checked> Tampilkan contoh hitungan poin</label>
      <button class="btn" id="unduh">Unduh gambar PNG</button>
      <div class="note">Contoh hitungan memakai 1 poin nusan = potongan Rp1. Kalau skema tokomu berbeda, matikan opsi contoh.</div>
    </div>
    <div class="prev"><canvas id="cv"></canvas></div>
  </div>
</div>

let logo = null;
function loadLogo() {
  const im = new Image();
  im.onload = () => { logo = im; draw(); };
  im.src = LOGO_SRC;
}
function drawLogo(c, t, x, y, s) {
  if (logo && logo.naturalWidth) {
    const r = Math.min(s / logo.naturalWidth, s / logo.naturalHeight);
    const w = logo.naturalWidth * r, h = logo.naturalHeight * r;
    c.drawImage(logo, x + s - w, y + (s - h) / 2, w, h);
    return;
  }
  c.fillStyle = t.accent; circle(c, x + s / 2, y + s / 2, s / 2);
  c.fillStyle = t.onAccent; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '800 ' + Math.round(s * 0.56) + 'px ' + FONT;
  c.fillText('N', x + s / 2, y + s / 2 + s * 0.03);
  c.textAlign = 'left'; c.textBaseline = 'top';
}
function drawWeb(c, t, xr, y, size) {
  c.font = '700 ' + size + 'px ' + FONT; c.textAlign = 'right'; c.fillStyle = t.accent2;
  c.fillText(WEB, xr, y); c.textAlign = 'left';
}

function wrap(c, txt, maxW) {
  const out = [];
  String(txt).split(/\n/).forEach(p => {
    let line = '';
    p.split(/\s+/).filter(Boolean).forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out;
}
function fit(c, txt, maxW, maxL, size, min, wt) {
  let s = size, lines;
  for (; s >= min; s -= 4) {
    c.font = wt + ' ' + s + 'px ' + FONT;
    lines = wrap(c, txt, maxW);
    if (lines.length <= maxL && lines.every(l => c.measureText(l).width <= maxW)) break;
  }
  s = Math.max(s, min);
  c.font = wt + ' ' + s + 'px ' + FONT;
  return {s: s, lines: wrap(c, txt, maxW).slice(0, maxL)};
}
function lines(c, arr, x, y, lh, color) {
  c.fillStyle = color;
  arr.forEach((l, i) => c.fillText(l, x, y + i * lh));
  return y + arr.length * lh;
}
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function nf(n, d) { return n.toLocaleString('id-ID', {maximumFractionDigits: d || 0}); }

function badge(c, t, x, y, w, h, bonus) {
  c.fillStyle = t.accent; rr(c, x, y, w, h, 28); c.fill();
  c.textAlign = 'center'; c.textBaseline = 'top'; c.fillStyle = t.onAccent;
  c.font = '700 ' + Math.round(h * 0.15) + 'px ' + FONT;
  c.fillText('BONUS POIN NUSAN', x + w / 2, y + h * 0.13);
  c.font = '800 ' + Math.round(h * 0.52) + 'px ' + FONT;
  c.fillText(nf(bonus, 2) + '%', x + w / 2, y + h * 0.33);
  c.textAlign = 'left';
}

function draw() {
  const f = FORMATS[$('fmt').value], t = THEMES[$('tema').value];
  const toko = ($('toko').value.trim() || 'Nama Toko'), judul = ($('judul').value.trim() || 'Judul promo');
  const ket = $('ket').value.trim();
  const bonus = Math.min(100, Math.max(0.1, parseFloat($('bonus').value) || 1));
  const tgl = $('tgl').value ? new Date($('tgl').value + 'T00:00:00').toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}) : '';
  const showEx = $('contoh').checked;
  cv.width = f.w; cv.height = f.h;
  const c = cv.getContext('2d');

  const g = c.createLinearGradient(0, 0, f.w, f.h);
  g.addColorStop(0, t.bg1); g.addColorStop(1, t.bg2);
  c.fillStyle = g; c.fillRect(0, 0, f.w, f.h);
  c.globalAlpha = 0.13;
  c.fillStyle = t.accent2; circle(c, f.w * 0.92, f.h * 0.08, Math.min(f.w, f.h) * 0.36);
  c.fillStyle = t.accent;  circle(c, f.w * 0.04, f.h * 0.96, Math.min(f.w, f.h) * 0.28);
  c.globalAlpha = 1;
  c.textBaseline = 'top'; c.textAlign = 'left';

  const ex1 = 'Belanja Rp100.000 → ' + nf(100000 * bonus / 100) + ' poin nusan';
  const ex2 = '1 poin = potongan Rp1 di kunjungan berikutnya';
  const foot1 = tgl ? 'Berlaku sampai ' + tgl : '';
  const foot2 = 'Poin nusan lewat ELNUX miniPOS';

  if (f.w > f.h * 1.4) {            // kupon (landscape)
    const m = 80, colW = 1040;
    c.strokeStyle = t.accent; c.lineWidth = 4; c.setLineDash([20, 14]); rr(c, 26, 26, f.w - 52, f.h - 52, 24); c.stroke(); c.setLineDash([]);
    let y = 90;
    const a = fit(c, toko.toUpperCase(), colW, 1, 40, 24, '800');
    c.fillStyle = t.accent; c.fillText(a.lines[0], m, y); y += a.s + 18;
    c.fillRect(m, y, 120, 8); y += 44;
    const j = fit(c, judul, colW, 2, 96, 52, '800');
    y = lines(c, j.lines, m, y, j.s * 1.12, t.text) + 22;
    if (ket) { const k = fit(c, ket, colW, 2, 34, 24, '500'); y = lines(c, k.lines, m, y, k.s * 1.35, t.muted) + 22; }
    if (showEx) {
      c.font = '700 36px ' + FONT; c.fillStyle = t.text; c.fillText(ex1, m, y);
      c.font = '500 28px ' + FONT; c.fillStyle = t.muted; c.fillText(ex2, m, y + 46);
    }
    c.font = '800 36px ' + FONT; c.textAlign = 'right'; c.fillStyle = t.accent2; c.fillText('KUPON', f.w - m - 130, 90); c.textAlign = 'left';
    drawLogo(c, t, f.w - m - 100, 40, 100);
    badge(c, t, 1250, 150, 470, 380, bonus);
    c.font = '600 32px ' + FONT; c.fillStyle = t.text; if (foot1) c.fillText(foot1, m, f.h - 130);
    c.font = '500 26px ' + FONT; c.fillStyle = t.muted; c.fillText(foot2, m, f.h - (foot1 ? 82 : 100));
    drawWeb(c, t, f.w - m, f.h - (foot1 ? 84 : 102), 30);
    return;
  }

  const m = 86, maxW = f.w - 2 * m;  // post & story
  let y = f.top;
  const a = fit(c, toko.toUpperCase(), maxW - 150, 1, 44, 26, '800');
  c.fillStyle = t.accent; c.fillText(a.lines[0], m, y); drawLogo(c, t, f.w - m - 110, y - 12, 110); y += a.s + 20;
  c.fillRect(m, y, 120, 8); y += 48;
  const j = fit(c, judul, maxW, f.jLines, f.jSize, 56, '800');
  y = lines(c, j.lines, m, y, j.s * 1.12, t.text) + 32;
  badge(c, t, m, y, maxW, f.badgeH, bonus); y += f.badgeH + 32;
  if (showEx) {
    c.font = '700 38px ' + FONT; c.fillStyle = t.text; c.fillText(ex1, m, y);
    c.font = '500 30px ' + FONT; c.fillStyle = t.muted; c.fillText(ex2, m, y + 48); y += 48 + 30 + 28;
  }
  if (ket) { const k = fit(c, ket, maxW, f.kLines, 34, 26, '500'); lines(c, k.lines, m, y, k.s * 1.35, t.muted); }
  const fy = f.h - (f.h > 1500 ? 230 : 130);
  c.font = '600 34px ' + FONT; c.fillStyle = t.text; if (foot1) c.fillText(foot1, m, fy);
  c.font = '500 28px ' + FONT; c.fillStyle = t.muted; c.fillText(foot2, m, fy + (foot1 ? 46 : 0));
  drawWeb(c, t, f.w - m, fy + (foot1 ? 46 : 0) - 2, 32);
}

['toko','judul','ket','bonus','tgl','fmt','tema','contoh'].forEach(id => {
  $(id).addEventListener('input', draw); $(id).addEventListener('change', draw);
});
$('unduh').addEventListener('click', () => {
  draw();
  cv.toBlob(b => {
    const slug = ($('toko').value || 'toko').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'toko';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'promo-' + slug + '-' + $('fmt').value + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
});
draw();
loadLogo();
</script>
